<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Saksham Nirula · A World Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="stage">
    <!-- globe lives here; the panel takes the remaining space -->
    <div id="globeWrap">
      <canvas id="space"></canvas>
      <div id="labels"></div>
      <div id="globeHint" class="globe-hint">drag to rotate · tap a marker to open</div>
    </div>

    <!-- responsive content panel: side column on wide screens, sheet on small -->
    <aside id="panel" class="panel" aria-hidden="true">
      <header class="panel-head">
        <div class="panel-eyebrow"><span class="panel-dot"></span><span id="panelKicker">SECTION</span></div>
        <h2 id="panelTitle">Title</h2>
        <button id="panelClose" class="panel-close" aria-label="Close">✕</button>
      </header>
      <div id="panelBody" class="panel-body"></div>
    </aside>
  </div>

  <!-- top bar -->
  <header id="topbar" class="topbar hidden">
    <div class="brand">
      <div class="brand-name">SAKSHAM NIRULA</div>
      <div class="brand-role">Business Analyst · A.I. Enthusiast</div>
    </div>
    <nav id="nav" class="nav"></nav>
    <button id="navToggle" class="nav-toggle" aria-label="Sections">☰</button>
  </header>

  <!-- intro -->
  <section id="intro">
    <div class="intro-inner">
      <div id="typed" class="typed"></div>
      <button id="launch" class="launch">ENTER <span class="bz">▸</span></button>
      <div id="introHint" class="hint">one world · seven places to explore</div>
    </div>
  </section>

  <div id="tip" class="tip"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
